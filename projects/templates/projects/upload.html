<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VulnSync | Upload Offensive Data</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; padding: 50px; }
        .container { max-width: 500px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 8px; }
        select, input, button { width: 100%; margin-bottom: 15px; padding: 10px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Upload Nmap Scan</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <label>Select Target Project:</label>
            <select name="project_id" required>
                {% for project in projects %}
                    <option value="{{ project.id }}">{{ project.name }}</option>
                {% endfor %}
            </select>
            
            <label>Nmap XML File:</label>
            <input type="file" name="nmap_file" accept=".xml" required>
            
            <button type="submit">Process & Sync Findings</button>
        </form>
    </div>
</body>
</html>
